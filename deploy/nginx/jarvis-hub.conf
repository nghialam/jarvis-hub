# JH3.0 Nginx Reverse Proxy Configuration
# Deploy to: /etc/nginx/sites-available/jarvis-hub
# Enable: ln -s /etc/nginx/sites-available/jarvis-hub /etc/nginx/sites-enabled/
#
# Usage after deployment:
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS is handled by P5.11 (Let's Encrypt / Certbot).

server {
    listen 80;
    server_name jarvis.example.com;  # Replace with actual domain

    # Redirect HTTP to HTTPS (after SSL is configured)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jarvis.example.com;

    # ----- SSL (P5.11 Let's Encrypt) -----
    ssl_certificate /etc/letsencrypt/live/jarvis.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ----- Security Headers -----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----- Client Limits -----
    client_max_body_size 10m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # ----- Proxy to Flask app (local Mac Mini) -----
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        # WebSocket support (if needed for real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout tuning for LLM/AI routes (may take longer)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # Buffering (disable for streaming responses)
        proxy_buffering off;
    }

    # ----- Static files (if deployed to Vercel CDN, skip here) -----
    # For local static files:
    # location /static/ {
    #     alias /Users/nghialam/jarvis-hub/static/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }

    # ----- Health check (no auth required) -----
    location /health {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # ----- API rate limiting -----
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ----- Deny access to hidden files -----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
